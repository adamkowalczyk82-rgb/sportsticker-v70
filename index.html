<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MONKEY BAR Sports Ticker</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Oswald:wght@500;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        :root {
            --primary-glow: #00f0ff;
            --secondary-glow: #ff0055;
            --accent-gold: #ffea00;
            --bg-dark: #010308;
            --card-bg: rgba(4, 10, 20, 0.94);
            --team-primary: #00f0ff;
            --team-secondary: #ff0055;
            --stadium-glow: rgba(0, 240, 255, 0.2);
            --winning-color-1: #00f0ff;
            --winning-color-2: #ff0055;
            --anim-color-1: #00f0ff;
            --anim-color-2: #ff0055;
        }
        html, body {
            width: 100vw; height: 100vh; overflow: hidden;
            background-color: var(--bg-dark); color: #ffffff;
            font-family: 'Roboto Condensed', sans-serif; cursor: none;
        }
        #cyberCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%); background-size: 100% 4px; z-index: 2; opacity: 0.3;
        }
        body.rotated-90 {
            width: 100vh !important; height: 100vw !important; transform: rotate(90deg); transform-origin: center center;
            position: absolute; top: calc(50% - 50vw); left: calc(50% - 50vh);
        }
        .tv-frame {
            width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between;
            background: radial-gradient(circle at 50% 20%, var(--stadium-glow) 0%, rgba(1, 3, 8, 0.98) 85%);
            position: relative; box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.95); transition: background 1.2s ease-in-out; z-index: 3; overflow: hidden;
        }
        .stadium-flare {
            position: absolute; top: -15%; left: 50%; transform: translateX(-50%); width: 160%; height: 50vh;
            background: radial-gradient(ellipse at top, var(--team-primary) 0%, rgba(0,0,0,0) 70%);
            opacity: 0.35; pointer-events: none; transition: background 1.2s ease-in-out; z-index: 2; animation: pulseFlare 5s ease-in-out infinite alternate;
        }
        @keyframes pulseFlare {
            0% { opacity: 0.25; transform: translateX(-50%) scale(0.95); }
            100% { opacity: 0.5; transform: translateX(-50%) scale(1.08); }
        }
        #scoreAlertOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; pointer-events: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(1, 3, 8, 0); opacity: 0;
        }
        #scoreAlertOverlay.active { opacity: 1; animation: alertFlashBg 2.5s ease-in-out forwards; }
        @keyframes alertFlashBg {
            0% { background: rgba(1, 3, 8, 0); }
            15% { background: rgba(1, 3, 8, 0.88); }
            85% { background: rgba(1, 3, 8, 0.88); }
            100% { background: rgba(1, 3, 8, 0); }
        }
        .alert-banner-box {
            background: rgba(2, 6, 15, 0.96); border: 3px solid var(--anim-color-1); border-radius: 12px; padding: 2.5vh 4vw;
            display: flex; flex-direction: column; align-items: center; gap: 1.5vh;
            box-shadow: 0 0 50px var(--anim-color-1), 0 0 25px var(--anim-color-2), inset 0 0 30px var(--anim-color-1); transform: scale(0.5); opacity: 0;
        }
        #scoreAlertOverlay.active .alert-banner-box { animation: alertBoxPop 2.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes alertBoxPop {
            0% { transform: scale(0.5); opacity: 0; }
            20% { transform: scale(1.05); opacity: 1; }
            30% { transform: scale(1); opacity: 1; }
            80% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0; }
        }
        .alert-title-tag {
            font-family: 'Teko', sans-serif; font-size: clamp(2.2rem, 5vh, 4rem); font-weight: 700; line-height: 1; letter-spacing: 4px;
            background: linear-gradient(180deg, #ffffff 20%, var(--anim-color-1) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; text-align: center;
        }
        .alert-team-row { display: flex; align-items: center; gap: 2vw; }
        .alert-team-logo { width: clamp(60px, 9vh, 110px); height: clamp(60px, 9vh, 110px); object-fit: contain; filter: drop-shadow(0 0 15px var(--anim-color-1)); }
        .alert-details { display: flex; flex-direction: column; align-items: flex-start; }
        .alert-team-name { font-family: 'Teko', sans-serif; font-size: clamp(1.5rem, 3vh, 2.5rem); color: var(--anim-color-1); line-height: 0.9; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 12px var(--anim-color-2); }
        .alert-score-delta { font-family: 'Oswald', sans-serif; font-size: clamp(1.8rem, 3.5vh, 3rem); font-weight: 700; color: #ffffff; text-shadow: 0 0 12px var(--anim-color-1); }

        header {
            z-index: 10; padding: 0.5vh 2vw 0.4vh; background: linear-gradient(180deg, rgba(1,3,8,0.98) 0%, rgba(1,3,8,0.7) 85%, transparent 100%);
            border-bottom: 2px solid var(--winning-color-1); display: flex; flex-direction: column; align-items: center; position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6), 0 0 12px var(--winning-color-1); transition: border-color 0.8s ease, box-shadow 0.8s ease; flex-shrink: 0;
        }
        .header-top-row { width: 100%; display: flex; justify-content: space-between; align-items: center; position: relative; min-height: clamp(20px, 2.6vh, 32px); }
        .bar-title {
            font-family: 'Teko', sans-serif; font-size: clamp(1.3rem, 2.3vh, 2rem); line-height: 1; font-weight: 700; text-transform: uppercase; letter-spacing: 3px;
            background: linear-gradient(180deg, #ffffff 20%, var(--winning-color-1) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            text-align: center; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); white-space: nowrap; pointer-events: none;
        }
        .live-clock { font-family: 'Oswald', sans-serif; font-size: clamp(0.6rem, 1vh, 0.9rem); color: var(--accent-gold); letter-spacing: 1.5px; text-shadow: 0 0 10px rgba(255, 234, 0, 0.6); z-index: 2; }
        .header-right-group { display: flex; align-items: center; gap: 8px; z-index: 2; }
        .global-redzone-badge {
            font-family: 'Oswald', sans-serif; font-size: clamp(0.5rem, 0.78vh, 0.68rem); color: #ffffff; background: #ff0044; border: 1px solid #ffea00;
            padding: 1px 6px; border-radius: 4px; letter-spacing: 1px; text-transform: uppercase; font-weight: 700; animation: pulseRedZone 0.8s infinite alternate; display: none;
        }
        .global-redzone-badge.active { display: inline-block; }
        @keyframes pulseRedZone {
            0% { opacity: 0.6; transform: scale(0.95); box-shadow: 0 0 5px #ff0044; }
            100% { opacity: 1; transform: scale(1.05); box-shadow: 0 0 15px #ffea00; }
        }
        .rotate-btn-icon {
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); color: #ffffff;
            width: clamp(18px, 2.3vh, 24px); height: clamp(18px, 2.3vh, 24px); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }
        .rotate-btn-icon:hover { background: rgba(0, 240, 255, 0.25); border-color: var(--primary-glow); transform: scale(1.1); }
        .rotate-btn-icon svg { width: 60%; height: 60%; fill: #ffffff; }
        .rotator-timer-bar { width: 100%; height: 2px; background: rgba(255, 255, 255, 0.1); position: absolute; bottom: 0; left: 0; overflow: hidden; }
        .rotator-progress { height: 100%; width: 0%; background: linear-gradient(90deg, var(--winning-color-1), var(--winning-color-2)); box-shadow: 0 0 8px var(--winning-color-1); transition: width 0.1s linear; }

        main { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 0.4vh 1.8vw; gap: 0.5vh; z-index: 5; overflow: hidden; position: relative; min-height: 0; }
        .neon-card-wrapper {
            position: relative; border-radius: 10px; padding: 2px;
            background: linear-gradient(var(--neon-angle, 0deg), var(--winning-color-1), #010308, var(--winning-color-2), #010308, var(--winning-color-1));
            animation: rotateNeonBorder 4s linear infinite, pulseCardGlow 2.5s infinite alternate ease-in-out; box-shadow: 0 0 10px var(--winning-color-1); overflow: hidden;
        }
        .neon-card-wrapper.matchup-wrap { flex: 1.35; min-height: 0; }
        .neon-card-wrapper.tape-wrap { flex: 0.95; min-height: 0; }
        .neon-card-wrapper.spotlight-wrap { flex: 1.2; min-height: 0; }
        body.rotated-90 .neon-card-wrapper.spotlight-wrap { flex: 1.7; }

        @property --neon-angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
        @keyframes rotateNeonBorder { 0% { --neon-angle: 0deg; } 100% { --neon-angle: 360deg; } }
        @keyframes pulseCardGlow { 0% { box-shadow: 0 0 6px var(--winning-color-1); } 100% { box-shadow: 0 0 14px var(--winning-color-1), 0 0 22px var(--winning-color-2); } }

        body.rotated-90 main { padding: 0.6vh 2vw; gap: 0.6vh; }

        .tape-card { background: var(--card-bg); border-radius: 8px; padding: 0.4vh 1vw; display: flex; flex-direction: column; height: 100%; width: 100%; backdrop-filter: blur(10px); overflow: hidden; transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out; }
        .tape-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: 'Oswald', sans-serif; font-size: clamp(0.55rem, 0.9vh, 0.78rem); color: var(--accent-gold); letter-spacing: 1.2px; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.12); padding-bottom: 1px; margin-bottom: 1px; white-space: nowrap; }
        .tape-header span:last-child { overflow: hidden; text-overflow: ellipsis; }
        .tape-metrics-grid { display: flex; flex-direction: column; justify-content: space-around; gap: 1px; flex: 1; min-height: 0; overflow: hidden; }
        .tape-metric-row { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.03); border-radius: 4px; padding: 1px 6px; font-size: clamp(0.6rem, 1vh, 0.9rem); }
        .tape-metric-label { color: #a0b0c0; font-family: 'Oswald', sans-serif; letter-spacing: 0.5px; width: 30%; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tape-metric-val-away { font-family: 'Oswald', sans-serif; font-weight: 700; width: 18%; text-align: right; white-space: nowrap; }
        .tape-metric-val-home { font-family: 'Oswald', sans-serif; font-weight: 700; width: 18%; text-align: left; white-space: nowrap; }
        .tape-bar-container { flex: 1; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin: 0 6px; position: relative; overflow: hidden; display: flex; }
        .tape-bar-container.no-bar { background: transparent; }
        .tape-bar-fill-away, .tape-bar-fill-home { height: 100%; transition: width 0.5s ease; }
        .tape-empty { font-family: 'Oswald', sans-serif; color: #8a9ba8; text-transform: uppercase; letter-spacing: 1px; font-size: clamp(0.6rem, 1vh, 0.9rem); text-align: center; margin: auto; }

        .matchup-card, .spotlight-card { background: var(--card-bg); border-radius: 8px; padding: 0.4vh 1vw; display: flex; flex-direction: column; justify-content: space-between; position: relative; height: 100%; width: 100%; backdrop-filter: blur(10px); transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out; opacity: 1; transform: scale(1); overflow: hidden; }
        .spotlight-card { justify-content: flex-start; }
        .matchup-card.fade-out, .spotlight-card.fade-out, .tape-card.fade-out { opacity: 0; transform: scale(0.98); }
        .status-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.1vh; padding-bottom: 0.1vh; border-bottom: 1px solid rgba(255, 255, 255, 0.12); }
        .status-left-group { display: flex; align-items: center; gap: 6px; }
        .game-status { font-family: 'Oswald', sans-serif; font-size: clamp(0.5rem, 0.8vh, 0.7rem); padding: 1px 4px; border-radius: 3px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.8px; }
        .status-live { background: #ff0044; color: #fff; animation: pulse-red 1.5s infinite; }
        .status-pregame { background: rgba(0, 240, 255, 0.2); color: #00f0ff; border: 1px solid #00f0ff; }
        .status-final { background: rgba(255, 255, 255, 0.15); color: #aaa; border: 1px solid rgba(255, 255, 255, 0.3); }
        .momentum-badge { font-family: 'Oswald', sans-serif; font-size: clamp(0.48rem, 0.7vh, 0.65rem); color: #ffea00; background: rgba(255, 234, 0, 0.15); border: 1px solid rgba(255, 234, 0, 0.5); padding: 1px 4px; border-radius: 3px; letter-spacing: 0.8px; text-transform: uppercase; display: none; }
        .momentum-badge.active { display: inline-block; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(255, 0, 68, 0.8); } 70% { box-shadow: 0 0 0 5px rgba(255, 0, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 0, 68, 0); } }
        .meta-badges { display: flex; gap: 4px; align-items: center; }
        .league-badge { font-size: clamp(0.48rem, 0.7vh, 0.65rem); color: #00f0ff; font-weight: 700; font-family: 'Oswald', sans-serif; letter-spacing: 0.6px; background: rgba(0, 240, 255, 0.1); padding: 1px 4px; border-radius: 3px; border: 1px solid rgba(0, 240, 255, 0.35); }
        .league-badge:empty, .network-info:empty { display: none; }
        .network-info { font-size: clamp(0.5rem, 0.78vh, 0.7rem); color: #00f0ff; font-weight: 700; font-family: 'Oswald', sans-serif; letter-spacing: 0.6px; }
        /* Matchup card is a size container: logos grow into whatever height the card has left
           (line score / odds / football field take theirs first), names and scores scale with it. */
        .matchup-card { container-type: size; }
        .teams-container { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; gap: 1vw; flex: 1 1 auto; min-height: 0; margin: 0.3vh 0; }
        .team-box { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-width: 0; min-height: 0; }
        .logo-wrapper { width: 100%; flex: 1 1 auto; min-height: 40px; max-height: 46cqh; position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 0.4vh; z-index: 10; }
        .vs-divider { align-self: center; }
        img[src="data:,"] { visibility: hidden; }
        .team-logo { width: 100%; height: 100%; max-width: 30cqw; object-fit: contain; position: relative; z-index: 10; filter: drop-shadow(0 0 14px rgba(0,0,0,0.6)); }
        .team-name { font-family: 'Teko', sans-serif; font-size: clamp(1rem, min(7cqh, 3.6cqw), 2.6rem); font-weight: 700; line-height: 0.85; flex-shrink: 0; text-transform: uppercase; letter-spacing: 1px; }
        .team-record { font-size: clamp(0.55rem, min(3.4cqh, 1.8cqw), 1.1rem); flex-shrink: 0; color: #8a9ba8; margin-top: 1px; font-family: 'Oswald', sans-serif; }
        .score-display { font-family: 'Oswald', sans-serif; font-size: clamp(1.4rem, min(12cqh, 6cqw), 4.2rem); font-weight: 700; color: #ffffff; line-height: 1; flex-shrink: 0; margin-top: 1px; text-shadow: 0 0 10px var(--winning-color-1); }
        .score-display:empty { display: none; }
        .vs-divider { display: flex; flex-direction: column; align-items: center; gap: 1px; max-width: 30vw; }
        .vs-text { font-family: 'Teko', sans-serif; font-size: clamp(0.9rem, min(8cqh, 3.4cqw), 2.4rem); color: var(--accent-gold); font-weight: 700; text-align: center; text-transform: uppercase; }
        .game-time { font-family: 'Oswald', sans-serif; font-size: clamp(0.5rem, min(3.6cqh, 1.7cqw), 1.05rem); color: #ffffff; text-align: center; letter-spacing: 0.6px; text-transform: uppercase; }

        .linescore-table-container { width: 100%; background: rgba(2, 4, 8, 0.75); border: 1px solid rgba(0, 240, 255, 0.25); border-radius: 4px; padding: 2px 6px; margin-top: 0.1vh; overflow: hidden; }
        .linescore-table { width: 100%; border-collapse: collapse; font-family: 'Oswald', sans-serif; font-size: clamp(0.5rem, 0.78vh, 0.65rem); text-align: center; }
        .linescore-table th { color: #8a9ba8; font-weight: 500; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1px; }
        .linescore-table td { color: #ffffff; padding: 1px 0; }
        .linescore-table td:first-child, .linescore-table th:first-child { text-align: left; padding-left: 4px; }

        .sport-graphic-container { width: 100%; background: linear-gradient(180deg, #051428 0%, #010814 100%); border: 1.5px solid rgba(0, 240, 255, 0.45); border-radius: 5px; padding: 0.3vh 0.5vw; margin-top: 0.1vh; display: none; flex-direction: column; align-items: center; }
        .graphic-title-text { font-family: 'Oswald', sans-serif; font-size: clamp(0.55rem, 0.82vh, 0.7rem); color: var(--accent-gold); letter-spacing: 1px; font-weight: 700; margin-bottom: 1px; text-transform: uppercase; }
        .football-field { width: 100%; height: clamp(24px, 2.8vh, 30px); background: #0d2818; border: 1.5px solid rgba(255, 255, 255, 0.4); border-radius: 3px; position: relative; display: flex; overflow: hidden; }
        .endzone { width: 10%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; padding: 2px; }
        .endzone-logo { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 0 3px rgba(0,0,0,0.9)) drop-shadow(0 0 1px rgba(0,0,0,0.9)); }
        .endzone.left-ez { border-right: 1px solid rgba(255, 255, 255, 0.6); }
        .endzone.right-ez { border-left: 1px solid rgba(255, 255, 255, 0.6); }
        /* Playing area spans goal line (0%) to goal line (100%); yard lines sit at exact 10-yard intervals. */
        .field-playing-area { flex: 1; height: 100%; position: relative; background: repeating-linear-gradient(90deg, #0f331d 0%, #0f331d 10%, #133f24 10%, #133f24 20%); }
        .field-yardline { position: absolute; top: 0; width: 1px; height: 100%; background: rgba(255, 255, 255, 0.25); transform: translateX(-50%); }
        .field-yardline.major { background: rgba(255, 255, 255, 0.55); }
        .yardline-number { position: absolute; bottom: 1px; left: 50%; transform: translateX(-50%); font-family: 'Oswald', sans-serif; font-size: clamp(0.38rem, 0.55vh, 0.48rem); color: rgba(255, 255, 255, 0.65); }
        .first-down-line { position: absolute; top: 0; width: 2px; height: 100%; background: #ffea00; z-index: 4; transform: translateX(-50%); transition: left 0.5s ease-in-out; }
        .football-marker { position: absolute; top: 50%; width: 8px; height: 8px; background: #00f0ff; border: 1.5px solid #ffffff; border-radius: 50%; transform: translate(-50%, -50%); z-index: 5; transition: left 0.5s ease-in-out; }
        .odds-bar { display: flex; justify-content: space-around; align-items: center; background: rgba(2, 4, 8, 0.65); border-top: 1px solid rgba(255, 255, 255, 0.12); padding: 0.2vh 1vw; border-radius: 4px; margin-top: 0.1vh; }
        .odds-item { font-family: 'Oswald', sans-serif; font-size: clamp(0.5rem, 0.75vh, 0.65rem); color: #a0b0c0; letter-spacing: 0.6px; }
        .odds-item span { color: var(--accent-gold); font-weight: 700; }

        .spotlight-title {
            font-family: 'Oswald', sans-serif; font-size: clamp(0.55rem, 0.85vh, 0.72rem); color: var(--winning-color-1);
            text-transform: uppercase; letter-spacing: 1.2px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12); padding-bottom: 0.1vh; margin-bottom: 0.3vh; flex-shrink: 0;
        }

        /* ===== Broadcast player cards (TV lower-third style) ===== */
        .players-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8vw; flex: 1; min-height: 0; }
        body.rotated-90 .players-grid { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; gap: 0.8vh; }
        /* Rotated layout on a short screen (e.g. a phone held upright): rotated height = 100vw, too short to stack — go side by side */
        @media (max-width: 700px) {
            body.rotated-90 .players-grid { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; gap: 0.8vh; }
            body.rotated-90 .neon-card-wrapper.spotlight-wrap { flex: 1.35; }
        }
        .bp-card { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
        .bp-main {
            flex: 1; min-height: 0; display: flex; overflow: hidden; border-radius: 3px;
            border: 1px solid rgba(168, 200, 255, 0.28); box-shadow: 0 4px 16px rgba(0,0,0,0.65);
        }
        .bp-photo { width: 40%; flex-shrink: 0; position: relative; overflow: hidden; background: var(--p-team-color, #f47a38); display: flex; align-items: flex-end; justify-content: center; }
        .bp-watermark {
            position: absolute; left: 50%; top: 50%; width: 125%; height: 125%; transform: translate(-50%, -50%);
            object-fit: contain; opacity: 0.22; filter: grayscale(100%) brightness(2.4); pointer-events: none;
        }
        /* Fill the panel's full height (head & shoulders, broadcast style); sides of the wide ESPN headshot are cropped. */
        .bp-headshot { position: absolute; z-index: 2; left: 0; bottom: 0; height: 100%; width: 100%; object-fit: cover; object-position: center top; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.45)); }
        .bp-photo.is-logo { align-items: center; }
        .bp-photo.is-logo .bp-headshot { position: relative; height: 74%; width: 74%; object-fit: contain; object-position: center; filter: drop-shadow(0 0 6px rgba(0,0,0,0.6)); }
        .bp-photo.is-logo .bp-watermark { display: none; }
        /* Stat panel is a size container: numbers/labels scale with the panel itself, not the screen,
           so they never collide on narrow (side-by-side / phone / tablet) layouts. */
        .bp-stats { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 0.5vh 0.8vw 0.4vh; background: linear-gradient(180deg, #1c3f86 0%, #13306a 100%); container-type: size; overflow: hidden; }
        .bp-pos {

    <script>
    (function () {
        'use strict';

        /* ================= CONFIG ================= */
        const ESPN = 'https://site.api.espn.com/apis/site/v2/sports';
        const ESPN_WEB = 'https://site.web.api.espn.com/apis/common/v3/sports';   // athlete season overviews
        const ATHLETE_TTL_MS = 30 * 60000;
        const ROTATE_INTERVAL_MS = 12000;
        const REFRESH_MS = 15000;          // wait this long AFTER a refresh finishes before the next one
        const FETCH_TIMEOUT_MS = 8000;     // a slow ESPN response is abandoned, never freezes the screen
        const CONCURRENCY = 6;             // parallel requests
        const MAX_GAMES_PER_FEED = 12;     // cap heavy feeds (college slates) per league per day
        const NEWS_TTL_MS = 5 * 60000;
        const TEAM_RECORD_TTL_MS = 30 * 60000;
        const TZ = 'America/Chicago';

        const ENDPOINTS = [
            { sport: 'basketball', league: 'nba', label: 'NBA', kind: 'basketball', cdn: 'nba' },
            { sport: 'basketball', league: 'wnba', label: 'WNBA', kind: 'basketball', cdn: 'wnba' },
            { sport: 'basketball', league: 'mens-college-basketball', label: 'NCAAM', kind: 'basketball', cdn: 'mens-college-basketball', groups: '50' },
            { sport: 'football', league: 'nfl', label: 'NFL', kind: 'football', cdn: 'nfl' },
            { sport: 'football', league: 'college-football', label: 'NCAAF', kind: 'football', cdn: 'college-football', groups: '80' },
            { sport: 'hockey', league: 'nhl', label: 'NHL', kind: 'hockey', cdn: 'nhl' },
            { sport: 'baseball', league: 'mlb', label: 'MLB', kind: 'baseball', cdn: 'mlb' },
            { sport: 'mma', league: 'ufc', label: 'UFC', kind: 'fight', cdn: 'mma' }
            // Boxing removed: ESPN's site API answers 400 "sport 'boxing' and/or league 'boxing' are invalid".
        ];

        const POSITION_NAMES = {
            hockey: { C: 'CENTER', LW: 'LEFT WING', RW: 'RIGHT WING', W: 'WING', F: 'FORWARD', D: 'DEFENSE', G: 'GOALTENDER' },
            basketball: { PG: 'POINT GUARD', SG: 'SHOOTING GUARD', SF: 'SMALL FORWARD', PF: 'POWER FORWARD', G: 'GUARD', F: 'FORWARD', C: 'CENTER', 'G-F': 'GUARD-FORWARD', 'F-C': 'FORWARD-CENTER' },
            football: { QB: 'QUARTERBACK', RB: 'RUNNING BACK', HB: 'HALFBACK', FB: 'FULLBACK', WR: 'WIDE RECEIVER', TE: 'TIGHT END', K: 'KICKER', P: 'PUNTER' },
            baseball: { P: 'PITCHER', SP: 'STARTING PITCHER', RP: 'RELIEF PITCHER', C: 'CATCHER', '1B': 'FIRST BASE', '2B': 'SECOND BASE', '3B': 'THIRD BASE', SS: 'SHORTSTOP', LF: 'LEFT FIELD', CF: 'CENTER FIELD', RF: 'RIGHT FIELD', DH: 'DESIGNATED HITTER', OF: 'OUTFIELD', IF: 'INFIELD' }
        };

        /* ================= STATE ================= */
        let liveMatchups = [];
        let currentMatchupIndex = 0;
        let hasRenderedOnce = false;
        let rotatorElapsed = 0;
        let refreshInFlight = false;
        let lastTickerHtml = '';
        const previousScoresCache = {};
        const finalSummaryCache = new Map();
        const teamRecordCache = new Map();
        let newsCache = { t: 0, items: [] };

        const $ = (id) => document.getElementById(id);

        /* ================= HELPERS ================= */
        function escapeHtml(v) {
            return String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function safeUrl(u) {
            return (typeof u === 'string' && /^https?:\/\//i.test(u)) ? u : '';
        }
        function num(v) {
            if (v === null || v === undefined) return NaN;
            const n = parseFloat(String(v).replace(/,/g, '').trim());
            return Number.isFinite(n) ? n : NaN;
        }
        function hasVal(v) {
            if (v === null || v === undefined) return false;
            const s = String(v).trim();
            return s !== '' && s !== '--' && s !== '-';
        }

        // Direct ESPN first — ESPN allows browser requests from any website, so on GitHub Pages or any
        // other host this is all that is needed. Only if a network blocks ESPN does it try a relay:
        // the same site's /api/espn (when served by the MONKEY BAR app), then RELAY_BASE if you set one.
        // OPTIONAL: paste your own relay address here (e.g. a free Cloudflare Worker, see monkey-bar-relay-worker.js).
        const RELAY_BASE = '';
        const IS_WEB = /^https?:$/.test(location.protocol);
        const RELAY_ABS = RELAY_BASE.replace(/\/+$/, '');
        const RELAYS = [...(IS_WEB ? [''] : []), ...(RELAY_ABS && RELAY_ABS !== location.origin ? [RELAY_ABS] : [])];
        let relayIdx = 0;
        let useRelay = false;
        let directFailures = 0;

        async function rawFetch(url) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
            try {
                const res = await fetch(url, { signal: ctrl.signal });
                return { ok: res.ok, data: res.ok ? await res.json() : null, network: false };
            } catch (e) {
                return { ok: false, data: null, network: e.name !== 'AbortError' };
            } finally {
                clearTimeout(timer);
            }
        }
        // Try the relay that worked last, then the others; remember whichever answers.
        async function relayFetch(query) {
            for (let n = 0; n < RELAYS.length; n++) {
                const i = (relayIdx + n) % RELAYS.length;
                const r = await rawFetch(`${RELAYS[i]}/api/espn?${query}`);
                if (r.ok) { relayIdx = i; return r.data; }
            }
            return null;
        }
        async function fetchJSON(url) {
            let query = '';
            if (url.startsWith(ESPN + '/')) query = `path=${encodeURIComponent(url.slice(ESPN.length + 1))}`;
            else if (url.startsWith(ESPN_WEB + '/')) query = `src=web&path=${encodeURIComponent(url.slice(ESPN_WEB.length + 1))}`;
            const canRelay = !!query && RELAYS.length > 0;
            if (useRelay && canRelay) return relayFetch(query);
            const r = await rawFetch(url);
            if (r.ok) return r.data;
            if (r.network && canRelay) {
                if (++directFailures >= 2) useRelay = true;
                return relayFetch(query);
            }
            return null;
        }

        async function mapLimit(items, limit, fn) {
            const out = new Array(items.length);
            let next = 0;
            async function worker() {
                while (next < items.length) {
                    const idx = next++;
                    try { out[idx] = await fn(items[idx], idx); }
                    catch (e) { console.warn('Item failed, skipped:', e); out[idx] = null; }
                }
            }
            await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
            return out;
        }

        function chicagoDateStr(offsetDays) {
            const d = new Date(Date.now() + offsetDays * 86400000);
            return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d).replace(/-/g, '');
        }
        function formatTimeCT(dateString) {
            if (!dateString) return '';
            const d = new Date(dateString);
            if (isNaN(d.getTime())) return '';
            return d.toLocaleTimeString('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit', hour12: true }) + ' CT';
        }

        function luminance(hex) {
            const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
            if (!m) return 1;
            const n = parseInt(m[1], 16);
            return (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
        }
        function readable(primary, alt, fallback) {
            if (primary && luminance(primary) >= 0.22) return primary;
            if (alt && luminance(alt) >= 0.22) return alt;
            return fallback;
        }
        function hexColor(c) {
            return (typeof c === 'string' && /^[0-9a-f]{6}$/i.test(c)) ? `#${c}` : '';
        }

        function shortName(athlete) {
            if (!athlete) return '';
            if (athlete.shortName) return athlete.shortName.replace(/\.\s+/, '.');
            const full = athlete.displayName || athlete.fullName || '';
            const parts = full.trim().split(/\s+/);
            if (parts.length < 2) return full;
            return `${parts[0][0]}.${parts.slice(1).join(' ')}`;
        }

        function positionName(pos, kind) {
            if (!pos) return '';
            const abbr = String(pos.abbreviation || '').toUpperCase();
            const map = POSITION_NAMES[kind] || {};
            if (map[abbr]) return map[abbr];
            return String(pos.displayName || pos.name || abbr || '').toUpperCase();
        }

        // One stat column; singular label when the value is exactly 1. Missing values are dropped (column hidden).
        function col(value, singular, plural) {
            if (!hasVal(value)) return null;
            const s = String(value).trim();
            const isOne = !s.includes('/') && num(s) === 1;
            return { val: s, lbl: isOne ? singular : plural };
        }

        function parseRecord(summary) {
            const parts = String(summary || '').split('-').map((x) => parseInt(x, 10));
            return { w: parts[0], l: parts[1], d: parts[2] };
        }

        /* ================= BACKGROUND ANIMATION ================= */
        const canvas = $('cyberCanvas');
        const ctx = canvas.getContext('2d');
        const particles = [];
        let angle = 0;

        function resizeCanvas() {
            // Size to the canvas' own box, which follows the (possibly rotated) body.
            canvas.width = canvas.clientWidth || window.innerWidth;
            canvas.height = canvas.clientHeight || window.innerHeight;
            particles.forEach((p) => {
                p.x = Math.min(Math.max(p.x, 0), canvas.width);
                p.y = Math.min(Math.max(p.y, 0), canvas.height);
            });
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 80; i++) {
            particles.push({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5), vy: (Math.random() - 0.5),
                radius: Math.random() * 2.2 + 0.9, alpha: Math.random() * 0.75 + 0.25
            });
        }

        function drawCyberAnimation() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            angle += 0.0035;
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.08)';
            ctx.lineWidth = 2.5;
            ctx.save();
            ctx.translate(canvas.width * 0.5, canvas.height * 0.5);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.arc(0, 0, Math.min(canvas.width, canvas.height) * 0.52, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                ctx.fillStyle = `rgba(0, 240, 255, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                for (let j = i + 1; j < particles.length; j++) {   // each pair drawn once
                    const p2 = particles[j];
                    const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 120) {
                        ctx.strokeStyle = `rgba(0, 240, 255, ${0.2 * (1 - dist / 120)})`;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(drawCyberAnimation);
        }

        /* ================= FOOTBALL FIELD YARD LINES ================= */
        (function buildYardLines() {

        const alertQueue = [];

        let alertPlaying = false;

        function queueAlert(a) {

        function playNextAlert() {
            const a = alertQueue.shift();

        const SCORE_UNITS = {

        function scoreAlertTitle(kind, delta) {
            if (kind === 'football') {
                if (delta >= 6) return '🚨 TOUCHDOWN!';
                if (delta === 3) return '🚨 FIELD GOAL!';
                if (delta === 2) return '🚨 SAFETY / 2-PT!';
                return '🚨 SCORE UPDATE!';
            }
            if (kind === 'hockey') return '🚨 GOAL!';
            if (kind === 'baseball') return delta > 1 ? '⚾ RUNS SCORE!' : '⚾ RUN SCORES!';

        const ALERT_LEAGUES = new Set(['NFL', 'NCAAF', 'NHL']);   // pop-up alerts only for these leagues
        function detectScoreChanges(g) {
            const prev = previousScoresCache[g.id];
            previousScoresCache[g.id] = { away: g.away.score, home: g.home.score, final: g.isFinal };
            if (!prev || !ALERT_LEAGUES.has(g.leagueLabel)) return;

            if (g.isFight) {
                if (g.isFinal && !prev.final) {
                    const w = g.winnerSide ? g[g.winnerSide] : null;
                    queueAlert({
                        title: '🏆 FIGHT RESULT', name: w ? w.name : `${g.away.name} vs ${g.home.name}`,
                        line: w ? `WINS${g.resultText ? ' • ' + g.resultText : ''}` : (g.resultText || 'DRAW / NO CONTEST'),
                        logo: w ? w.logo : '', fallbackLogo: w ? w.fallbackLogo : '', c1: w ? w.color : '#00f0ff', c2: '#ffea00'
                    });
                }
                return;
            }

            const units = SCORE_UNITS[g.kind] || ['POINT', 'POINTS'];
            ['away', 'home'].forEach((side) => {
                const delta = g[side].score - prev[side];
                if (delta > 0) {
                    const t = g[side];
                    queueAlert({
                        title: scoreAlertTitle(g.kind, delta), name: t.name, logo: t.logo,
                        line: `+${delta} ${delta === 1 ? units[0] : units[1]}`, c1: t.color, c2: t.altColor
                    });
                }
            });
            if (g.isFinal && !prev.final) {
                const tie = g.away.score === g.home.score;
                const w = g.away.score > g.home.score ? g.away : g.home;
                queueAlert({
                    title: tie ? '🏁 FINAL' : '🏆 FINAL / WINNER', name: tie ? `${g.away.abbr} vs ${g.home.abbr}` : w.name,
                    logo: tie ? '' : w.logo, line: `FINAL SCORE: ${g.away.score} - ${g.home.score}`,

        /* ================= DATA: NEWS ================= */
