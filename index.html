        /* ================= KEY PLAYER (real box-score stats only) ================= */
        function statOf(cat, row, keys, labels) {
            const stats = row.stats || [];
            const catKeys = cat.keys || [];
            for (const k of keys) {
                const i = catKeys.indexOf(k);
                if (i !== -1) return stats[i];
            }
            const catLabels = (cat.labels || cat.names || []).map((l) => String(l).toUpperCase());
            for (const l of (labels || [])) {
                const i = catLabels.indexOf(l);
                if (i !== -1) return stats[i];
            }
            return undefined;
        }

        function pickKeyPlayer(summary, teamId, ep) {
            const teamBox = summary?.boxscore?.players?.find((p) => String(p.team?.id) === String(teamId));
            if (!teamBox || !Array.isArray(teamBox.statistics)) return null;
            const kind = ep.kind;
            const cats = teamBox.statistics;
            const catName = (c) => String(c.name || c.type || '').toLowerCase();
            const hockeyHasSplit = cats.some((c) => ['forwards', 'defenses'].includes(catName(c)));
            let best = null;
            const consider = (cand) => { if (!best || cand.score > best.score) best = cand; };

            for (const cat of cats) {
                const name = catName(cat);
                for (const row of (cat.athletes || [])) {
                    if (!row || !row.athlete || row.didNotPlay || !(row.stats || []).length) continue;
                    const g = (keys, labels) => statOf(cat, row, keys, labels);

                    if (kind === 'basketball') {
                        const pts = g(['points'], ['PTS']);
                        if (!hasVal(pts)) continue;
                        const reb = g(['rebounds'], ['REB']);
                        const ast = g(['assists'], ['AST']);
                        consider({ row, role: '', score: num(pts) + (num(reb) || 0) * 0.01,
                            cols: [col(pts, 'POINT', 'POINTS'), col(reb, 'REBOUND', 'REBOUNDS'), col(ast, 'ASSIST', 'ASSISTS')] });
                    } else if (kind === 'hockey') {
                        if (name === 'goalies') continue;
                        if (name === 'skaters' && hockeyHasSplit) continue;
                        const goals = g(['goals'], ['G']);
                        const assists = g(['assists'], ['A']);
                        const shots = g(['shotsTotal', 'shots'], ['S']);
                        if (!hasVal(goals) && !hasVal(assists)) continue;
                        consider({ row, role: '', score: (num(goals) || 0) * 3 + (num(assists) || 0) * 2 + (num(shots) || 0) * 0.1,
                            cols: [col(goals, 'GOAL', 'GOALS'), col(assists, 'ASSIST', 'ASSISTS'), col(shots, 'SHOT', 'SHOTS')] });
                    } else if (kind === 'football') {
                        let yds, td, third, role;
                        if (name === 'passing') {
                            yds = g(['passingYards'], ['YDS']); td = g(['passingTouchdowns'], ['TD']);
                            third = col(g(['completions/passingAttempts'], ['C/ATT']), 'COMP/ATT', 'COMP/ATT'); role = 'QUARTERBACK';
                        } else if (name === 'rushing') {
                            yds = g(['rushingYards'], ['YDS']); td = g(['rushingTouchdowns'], ['TD']);
                            third = col(g(['rushingAttempts'], ['CAR']), 'CARRY', 'CARRIES'); role = 'RUNNING BACK';
                        } else if (name === 'receiving') {
                            yds = g(['receivingYards'], ['YDS']); td = g(['receivingTouchdowns'], ['TD']);
                            third = col(g(['receptions'], ['REC']), 'CATCH', 'CATCHES'); role = 'RECEIVER';
                        } else continue;
                        if (!hasVal(yds)) continue;
                        consider({ row, role, score: num(yds) + (num(td) || 0) * 20,
                            cols: [col(yds, 'YARD', 'YARDS'), col(td, 'TD', 'TDS'), third] });
                    } else if (kind === 'baseball') {
                        if (name !== 'batting') continue;
                        const h = g(['hits'], ['H']); const rbi = g(['RBIs', 'RBI'], ['RBI']);
                        const hr = g(['homeRuns'], ['HR']); const r = g(['runs'], ['R']);
                        if (!hasVal(h)) continue;
                        consider({ row, role: '', score: num(h) * 2 + (num(rbi) || 0) * 2 + (num(hr) || 0) * 4 + (num(r) || 0),
                            cols: [col(h, 'HIT', 'HITS'), col(rbi, 'RBI', 'RBI'), col(hr, 'HOME RUN', 'HOME RUNS')] });
                    }
                }
            }
            if (!best) return null;
            const a = best.row.athlete;
            const img = safeUrl(a.headshot?.href || (typeof a.headshot === 'string' ? a.headshot : ''))
                || (a.id ? `https://a.espncdn.com/i/headshots/${ep.cdn}/players/full/${a.id}.png` : '');
            return {
                name: shortName(a),
                jersey: a.jersey ? `#${a.jersey}` : '',
                pos: best.role || positionName(a.position, kind) || 'STARTER',
                cols: best.cols.filter(Boolean),
                img
            };
        }

        /* ================= PREGAME KEY PLAYER (season stats + photo) ================= */
        const athleteCache = new Map();
        function headshotOf(a, ep) {
            return safeUrl(a?.headshot?.href || (typeof a?.headshot === 'string' ? a.headshot : ''))
                || (a?.id ? `https://a.espncdn.com/i/headshots/${ep.cdn}/players/full/${a.id}.png` : '');
        }
        async function fetchSeasonLine(ep, athleteId) {
            const key = `${ep.league}:${athleteId}`;
            const c = athleteCache.get(key);
            if (c && Date.now() - c.t < ATHLETE_TTL_MS) return c.v;
            const d = await fetchJSON(`${ESPN_WEB}/${ep.sport}/${ep.league}/athletes/${athleteId}/overview`);
            const s = d?.statistics;
            const split = (s?.splits || [])[0];   // current regular season
            const v = {};
            (s?.names || []).forEach((n, i) => { if (v[n] === undefined && split?.stats) v[n] = split.stats[i]; });
            if (d) athleteCache.set(key, { t: Date.now(), v });
            return v;
        }
        function pickPregameLeader(competitor, comp, ep) {
            const teamId = String(competitor.team?.id || '');
            let cats = (competitor.leaders || []).filter((l) => l?.leaders?.length);
            if (!cats.length) {   // football exposes some leaders only at competition level
                cats = (comp.leaders || []).map((l) => ({ ...l, leaders: (l.leaders || []).filter((x) => String(x.team?.id) === teamId) }))
                    .filter((l) => l.leaders.length);
            }
            if (!cats.length) return null;
            const find = (...names) => names.map((n) => cats.find((l) => l.name === n)).find(Boolean);
            let chosen;
            if (ep.kind === 'basketball') chosen = find('rating', 'pointsPerGame');
            else if (ep.kind === 'hockey') chosen = find('points', 'goals');
            else if (ep.kind === 'football') {
                const fb = cats.filter((l) => /passing|rushing|receiving/i.test(l.name || ''));
                chosen = fb.sort((a, b) => (num(b.leaders[0].value) || 0) - (num(a.leaders[0].value) || 0))[0];
            }
            chosen = chosen || cats[0];
            const L = chosen.leaders[0];
            return L?.athlete ? { athlete: L.athlete, cat: chosen, displayValue: L.displayValue || '' } : null;
        }
        // "24.7 PPG, 3.2 RPG" / "158 CAR, 632 YDS, 8 TD" -> columns (used only if the season overview is unavailable)
        function colsFromDisplay(text) {
            return String(text || '').split(',').map((part) => {
                const m = /^\s*([\d.,/]+)\s+([A-Za-z%]+)\s*$/.exec(part);
                return m ? { val: m[1], lbl: m[2].toUpperCase() } : null;
            }).filter(Boolean).slice(0, 3);
        }
        async function buildPregamePlayer(competitor, comp, ep, team) {
            const pick = pickPregameLeader(competitor, comp, ep);
            if (!pick) return null;
            const a = pick.athlete;
            const s = a.id ? await fetchSeasonLine(ep, a.id) : {};
            const posAbbr = String(a.position?.abbreviation || '').toUpperCase();
            const catName = String(pick.cat.name || '');
            let cols = [];
            let role = '';
            if (ep.kind === 'basketball') {
                cols = [col(s.avgPoints, 'PPG', 'PPG'), col(s.avgRebounds, 'RPG', 'RPG'), col(s.avgAssists, 'APG', 'APG')];
            } else if (ep.kind === 'hockey') {
                cols = [col(s.goals, 'GOAL', 'GOALS'), col(s.assists, 'ASSIST', 'ASSISTS'), col(s.points, 'POINT', 'POINTS')];
            } else if (ep.kind === 'football') {
                if (posAbbr === 'QB' || /passing/i.test(catName)) {
                    role = 'QUARTERBACK';
                    cols = [col(s.passingYards, 'PASS YD', 'PASS YDS'), col(s.passingTouchdowns, 'TD', 'TDS'), col(s.interceptions, 'INT', 'INTS')];
                } else if (['RB', 'HB', 'FB'].includes(posAbbr) || /rushing/i.test(catName)) {
                    role = 'RUNNING BACK';
                    cols = [col(s.rushingYards, 'RUSH YD', 'RUSH YDS'), col(s.rushingTouchdowns, 'TD', 'TDS'), col(s.rushingAttempts, 'CARRY', 'CARRIES')];
                } else {
                    role = 'RECEIVER';
                    cols = [col(s.receivingYards, 'REC YD', 'REC YDS'), col(s.receivingTouchdowns, 'TD', 'TDS'), col(s.receptions, 'CATCH', 'CATCHES')];
                }
            } else if (ep.kind === 'baseball') {
                const h = num(s.hits), ab = num(s.atBats);
                const avg = ab > 0 ? (h / ab).toFixed(3).replace(/^0/, '') : '';
                cols = [col(avg, 'AVG', 'AVG'), col(s.homeRuns, 'HR', 'HR'), col(s.RBIs, 'RBI', 'RBI')];
            }
            cols = cols.filter(Boolean);
            if (!cols.length) cols = colsFromDisplay(pick.displayValue);
            if (!cols.length && hasVal(pick.displayValue)) cols = [{ val: pick.displayValue, lbl: String(pick.cat.shortDisplayName || pick.cat.displayName || '').toUpperCase() }];
            const pos = positionName(a.position, ep.kind) || role || 'KEY PLAYER';
            return {
                name: shortName(a), jersey: a.jersey ? `#${a.jersey}` : '', img: headshotOf(a, ep), watermark: team.logo,
                pos: `${pos} • ${ep.kind === 'basketball' ? 'SEASON AVG' : 'SEASON'}`, cols,
                emptyText: 'SEASON STATS UNAVAILABLE'
            };
        }

        function teamFallbackCard(team, ep, isPregame) {
            return {
                isTeam: true, name: team.name, jersey: '', img: team.logo,
                pos: `${ep.label} • ${isPregame ? 'PREGAME' : 'TEAM'}`,
                cols: team.record ? [{ val: team.record, lbl: 'RECORD' }] : [],
                emptyText: isPregame ? 'PLAYER STATS AT GAME TIME' : 'PLAYER STATS UNAVAILABLE'
            };
        }

        /* ================= TALE OF THE TAPE (real numbers only) ================= */
        function calcPct(a, b) {
            const sum = a + b;
            if (!(sum > 0)) return { awayPct: 50, homePct: 50 };
            const pA = Math.max(5, Math.min(95, Math.round((a / sum) * 100)));
            return { awayPct: pA, homePct: 100 - pA };
        }
        function pushMetric(list, label, awayRaw, homeRaw, fmt) {
            const a = num(awayRaw), h = num(homeRaw);
            if (!Number.isFinite(a) || !Number.isFinite(h)) return;
            const f = fmt || ((v, raw) => String(raw));
            list.push({ label, awayVal: f(a, awayRaw), homeVal: f(h, homeRaw), ...calcPct(a, h) });
        }
        function boxTeamStats(summary, teamId) {
            const t = summary?.boxscore?.teams?.find((x) => String(x.team?.id) === String(teamId));
            const out = {};
            (t?.statistics || []).forEach((s) => { if (s && s.name && out[s.name] === undefined) out[s.name] = s.displayValue ?? s.value; });
            return out;
        }
        function compStats(competitor) {
            const out = {};
            (competitor?.statistics || []).forEach((s) => { if (s && s.name) out[s.name] = s.displayValue ?? s.value; });
            return out;
        }
        function clockToSeconds(v) {
            const m = /^(\d+):(\d{2})$/.exec(String(v || '').trim());
            return m ? (+m[1]) * 60 + (+m[2]) : NaN;
        }
        const fixed1 = (v) => v.toFixed(1);
        const pct0 = (v) => `${Math.round(v)}%`;

        function buildTapeMetrics(g, ep, summary, awayC, homeC, awayRec, homeRec) {
            const m = [];
            if (g.winProb && !g.isFinal) {
                m.push({ label: 'Win Probability', awayVal: `${g.winProb.away}%`, homeVal: `${g.winProb.home}%`, awayPct: g.winProb.away, homePct: g.winProb.home });
            }
            const kind = ep.kind;

            if (g.isPregame) {
                const as = compStats(awayC), hs = compStats(homeC);
                if (kind === 'basketball') {
                    pushMetric(m, 'Avg Points', as.avgPoints, hs.avgPoints);
                    pushMetric(m, 'Avg Rebounds', as.avgRebounds, hs.avgRebounds);
                    pushMetric(m, 'Avg Assists', as.avgAssists, hs.avgAssists);
                    pushMetric(m, 'FG %', as.fieldGoalPct, hs.fieldGoalPct, (v, raw) => `${raw}%`);
                } else {
                    const unit = kind === 'hockey' ? 'Goals' : (kind === 'baseball' ? 'Runs' : 'Points');
                    pushMetric(m, `${unit} / Game`, awayRec.avgPointsFor, homeRec.avgPointsFor, fixed1);
                    pushMetric(m, `Allowed / Game`, awayRec.avgPointsAgainst, homeRec.avgPointsAgainst, fixed1);
                    if (kind === 'hockey' && awayRec.powerPlayOpportunities > 0 && homeRec.powerPlayOpportunities > 0) {
                        pushMetric(m, 'Power Play %', (awayRec.powerPlayGoals / awayRec.powerPlayOpportunities) * 100,
                            (homeRec.powerPlayGoals / homeRec.powerPlayOpportunities) * 100, fixed1);
                    }
                }
                const aw = parseRecord(g.away.record), hw = parseRecord(g.home.record);
                const winPct = (r) => (r.w + r.l + (r.d || 0)) > 0 ? (r.w / (r.w + r.l + (r.d || 0))) * 100 : NaN;
                pushMetric(m, 'Win %', winPct(aw), winPct(hw), pct0);
                return m;
            }

            // Live / final: real box-score team stats
            const a = boxTeamStats(summary, g.away.id), h = boxTeamStats(summary, g.home.id);
            if (kind === 'basketball') {
                pushMetric(m, 'Points', g.away.score, g.home.score);
                pushMetric(m, 'Rebounds', a.totalRebounds ?? a.rebounds, h.totalRebounds ?? h.rebounds);
                pushMetric(m, 'Assists', a.assists, h.assists);
                pushMetric(m, 'FG %', a.fieldGoalPct, h.fieldGoalPct, (v, raw) => `${raw}%`);
                pushMetric(m, 'Turnovers', a.turnovers, h.turnovers);
            } else if (kind === 'hockey') {
                pushMetric(m, 'Goals', g.away.score, g.home.score);
                pushMetric(m, 'Shots', a.shotsTotal, h.shotsTotal);
                pushMetric(m, 'Hits', a.hits, h.hits);
                pushMetric(m, 'Faceoff %', a.faceoffPercent, h.faceoffPercent, (v, raw) => `${raw}%`);
                if (hasVal(a.powerPlayGoals) && hasVal(h.powerPlayGoals)) {
                    pushMetric(m, 'Power Play', a.powerPlayGoals, h.powerPlayGoals,
                        (v, raw) => raw === a.powerPlayGoals ? `${raw}/${a.powerPlayOpportunities ?? '-'}` : `${raw}/${h.powerPlayOpportunities ?? '-'}`);
                }
            } else if (kind === 'football') {
                const yds = (v, raw) => `${raw} YDS`;
                pushMetric(m, 'Total Offense', a.totalYards, h.totalYards, yds);
                pushMetric(m, 'Passing YDS', a.netPassingYards, h.netPassingYards, yds);
                pushMetric(m, 'Rushing YDS', a.rushingYards, h.rushingYards, yds);
                pushMetric(m, 'Turnovers', a.turnovers, h.turnovers);
                const pa = clockToSeconds(a.possessionTime), ph = clockToSeconds(h.possessionTime);
                if (Number.isFinite(pa) && Number.isFinite(ph)) {
                    m.push({ label: 'Possession', awayVal: a.possessionTime, homeVal: h.possessionTime, ...calcPct(pa, ph) });
                }
            } else if (kind === 'baseball') {
                pushMetric(m, 'Runs', g.away.score, g.home.score);
                pushMetric(m, 'Hits', awayC.hits, homeC.hits);
                pushMetric(m, 'Errors', awayC.errors, homeC.errors);
            }
            return m;
        }

        /* ================= FOOTBALL SITUATION ================= */
        function buildFootballSituation(sit, period, away, home) {
            if (!sit) return null;
            const possId = sit.possession ? String(sit.possession) : '';
            const possTeam = possId && possId === String(away.id) ? away : (possId && possId === String(home.id) ? home : null);
            const dist = num(sit.distance);

            // Yards from the possessing team's own goal line, derived from "ABBR 35" so it works both directions.
            let fromOwn = NaN;
            const pm = /^([A-Za-z&.'\- ]+?)\s+(\d{1,2})$/.exec(String(sit.possessionText || '').trim());
            if (pm && possTeam) {
                const n = parseInt(pm[2], 10);
                fromOwn = pm[1].toUpperCase() === String(possTeam.abbr).toUpperCase() ? n : 100 - n;
            } else if (/^50$/.test(String(sit.possessionText || '').trim())) {
                fromOwn = 50;
            } else if (Number.isFinite(num(sit.yardLine))) {
                fromOwn = num(sit.yardLine);
            }

            const leftTeam = (period % 2 === 0) ? home : away;     // each team defends the end zone showing its logo
            const rightTeam = leftTeam === home ? away : home;
            const goingRight = possTeam ? possTeam === leftTeam : true;

            let ballPct = null, firstDownPct = null;
            if (Number.isFinite(fromOwn)) {
                fromOwn = Math.max(0, Math.min(100, fromOwn));
                ballPct = goingRight ? fromOwn : 100 - fromOwn;
                if (Number.isFinite(dist) && dist > 0) {
                    const fd = Math.min(100, fromOwn + dist);
                    firstDownPct = goingRight ? fd : 100 - fd;
                }
            }
            const yardsToGoal = Number.isFinite(fromOwn) ? 100 - fromOwn : NaN;
            const isRedZone = sit.isRedZone === true || (yardsToGoal > 0 && yardsToGoal <= 20 && !!possTeam);
            const redZoneLabel = possTeam ? `🚨 ${possTeam.abbr} RED ZONE` : '🚨 RED ZONE';
            const text = (sit.downDistanceText || sit.shortDownDistanceText || (possTeam ? `${possTeam.abbr} BALL` : '')).toUpperCase();

            return { text, ballPct, firstDownPct, isRedZone, redZoneLabel,
                left: { logo: leftTeam.logo, color: leftTeam.color }, right: { logo: rightTeam.logo, color: rightTeam.color } };
        }

        /* ================= GAME BUILDERS ================= */
        function teamInfo(c, fallbackColor, fallbackAlt) {
            const t = c.team || {};
            const name = t.displayName || t.name || t.abbreviation || 'TBD';
            const primary = hexColor(t.color), alt = hexColor(t.alternateColor);
            return {
                id: t.id, name, abbr: t.abbreviation || name,
                logo: safeUrl(t.logo || t.logos?.[0]?.href || ''),
                record: c.records?.[0]?.summary || '',
                score: parseInt(c.score, 10) || 0,
                rawColor: primary || fallbackColor,
                color: readable(primary, alt, fallbackColor),
                altColor: readable(alt, primary, fallbackAlt)
            };
        }

        async function buildTeamGame(ev, ep, dateLabel, collector) {
            const comp = ev.competitions?.[0];
            if (!comp) return null;
            const st = comp.status?.type || ev.status?.type || {};
            const isLive = st.state === 'in', isFinal = st.state === 'post', isPregame = !isLive && !isFinal;
            const awayC = comp.competitors?.find((c) => c.homeAway === 'away');
            const homeC = comp.competitors?.find((c) => c.homeAway === 'home');
            if (!awayC || !homeC) return null;

            const away = teamInfo(awayC, '#00f0ff', '#00a0cc');
            const home = teamInfo(homeC, '#ff0055', '#ffea00');
            const period = comp.status?.period || ev.status?.period || 1;

            const [summary, awayRec, homeRec] = await Promise.all([
                (isLive || isFinal) ? fetchSummary(ep, ev.id, isFinal) : Promise.resolve(null),
                isPregame && ep.kind !== 'basketball' ? fetchTeamRecord(ep, away.id) : Promise.resolve({}),
                isPregame && ep.kind !== 'basketball' ? fetchTeamRecord(ep, home.id) : Promise.resolve({})
            ]);

            let winProb = null;
            const wp = summary?.winprobability;
            if (Array.isArray(wp) && wp.length) {
                const hp = wp[wp.length - 1]?.homeWinPercentage;
                if (typeof hp === 'number' && Number.isFinite(hp)) {
                    const homePct = Math.round(hp * 100);          // 0% stays 0%
                    winProb = { home: homePct, away: 100 - homePct };
                }
            }

            const leader = (!isPregame && away.score !== home.score) ? (away.score > home.score ? away : home) : home;
            const isFootball = ep.kind === 'football';
            let field = null;
            if (isFootball && isLive) {
                field = buildFootballSituation(comp.situation || summary?.situation, period, away, home);
                if (field?.isRedZone) collector.redZones.push(field.redZoneLabel);
            }

            let linescores = null;
            if (awayC.linescores?.length && homeC.linescores?.length) {
                const n = Math.max(awayC.linescores.length, homeC.linescores.length);
                const val = (l) => (l ? (l.displayValue ?? l.value ?? '') : '');
                linescores = {
                    periods: Array.from({ length: n }, (_, i) => awayC.linescores[i]?.period ?? i + 1),
                    awayLines: Array.from({ length: n }, (_, i) => val(awayC.linescores[i])),
                    homeLines: Array.from({ length: n }, (_, i) => val(homeC.linescores[i]))
                };
            }

            const o = comp.odds?.[0];
            const odds = {
                spread: o?.details || '',
                total: (o && o.overUnder !== undefined && o.overUnder !== null) ? `O/U ${o.overUnder}` : '',
                winProbText: winProb ? `${away.abbr} ${winProb.away}% • ${home.abbr} ${winProb.home}%` : ''
            };

            const statusText = isLive ? (st.shortDetail || st.detail || 'LIVE') : (isFinal ? (st.shortDetail || 'FINAL') : (st.description === 'Postponed' || st.name === 'STATUS_POSTPONED' ? 'POSTPONED' : 'UPCOMING'));
            const timeCenter = isLive ? (st.shortDetail || st.detail || '') : (isFinal ? (st.shortDetail || 'FINAL') : formatTimeCT(ev.date));

            const g = {
                id: ev.id, kind: ep.kind, isFight: false, isLive, isFinal, isPregame, isFootball,
                league: `${ep.label} • ${dateLabel}`, leagueLabel: ep.label,
                winningColor1: leader.color, winningColor2: leader.altColor,
                status: statusText.toUpperCase(),
                statusClass: isLive ? 'status-live' : (isFinal ? 'status-final' : 'status-pregame'),
                network: comp.broadcasts?.[0]?.names?.[0] || '',
                odds, field, linescores, winProb, away, home, timeCenter,
                vsText: 'VS', subtitle: `${away.abbr} vs ${home.abbr}`
            };
            g.tapeMetrics = buildTapeMetrics(g, ep, summary, awayC, homeC, awayRec, homeRec);

            const [aP, hP] = summary
                ? [pickKeyPlayer(summary, away.id, ep), pickKeyPlayer(summary, home.id, ep)]
                : (isPregame ? await Promise.all([buildPregamePlayer(awayC, comp, ep, away), buildPregamePlayer(homeC, comp, ep, home)]) : [null, null]);
            g.players = {
                away: aP ? { ...aP, watermark: away.logo } : teamFallbackCard(away, ep, isPregame),
                home: hP ? { ...hP, watermark: home.logo } : teamFallbackCard(home, ep, isPregame)
            };
            g.spotlightTitle = (aP || hP)
                ? (isPregame ? 'KEY PLAYERS • SEASON STATS' : (ep.kind === 'football' ? 'KEY PLAYER SPOTLIGHT' : 'TOP PERFORMERS'))
                : 'TEAM SPOTLIGHT';
            g.spotlightSub = isLive ? 'LIVE STATS' : (isFinal ? 'FINAL STATS' : 'PREGAME');

            const logoTag = (u) => u ? `<img src="${escapeHtml(u)}" class="ticker-logo" onerror="this.style.display='none'">` : '';
            g.tickerHtml = `<span class='league-tag'>${escapeHtml(ep.label)} (${dateLabel})</span> ${logoTag(away.logo)} ${escapeHtml(away.name)} <span class="score-num">${away.score}</span> - ${logoTag(home.logo)} ${escapeHtml(home.name)} <span class="score-num">${home.score}</span> [${escapeHtml(isPregame ? timeCenter : (st.shortDetail || st.detail || ''))}]`;
            return g;
        }

        async function buildFightGame(ev, ep, dateLabel) {
            const comps = ev.competitions || [];
            if (!comps.length) return null;
            // Show a fight in progress if there is one, otherwise the main event (listed last).
            const comp = comps.find((c) => c.status?.type?.state === 'in') || comps[comps.length - 1];
            const st = comp.status?.type || ev.status?.type || {};
            const isLive = st.state === 'in', isFinal = st.state === 'post', isPregame = !isLive && !isFinal;
            const fs = [...(comp.competitors || [])].sort((a, b) => (a.order || 0) - (b.order || 0));
            if (fs.length < 2) return null;

            const CORNERS = ['#e0213a', '#2f6bff'];
            const toFighter = (c, i) => {
                const a = c.athlete || {};
                const rec = c.records?.[0]?.summary || '';
                const flag = safeUrl(a.flag?.href || '');
                return {
                    id: a.id, name: a.displayName || a.fullName || 'TBD', abbr: shortName(a) || a.displayName || 'TBD',
                    logo: safeUrl(a.headshot?.href || '') || (a.id ? `https://a.espncdn.com/i/headshots/${ep.cdn}/players/full/${a.id}.png` : ''),
                    fallbackLogo: flag, flag, record: rec, winner: c.winner === true,
                    score: 0, color: CORNERS[i], altColor: '#ffea00', rawColor: CORNERS[i], athlete: a
                };
            };
            const away = toFighter(fs[0], 0), home = toFighter(fs[1], 1);
            const weight = String(comp.type?.abbreviation || comp.type?.text || '').toUpperCase();
            const res = comp.status?.result || {};
            const method = String(res.displayName || res.shortDisplayName || res.name || '').toUpperCase();
            const round = comp.status?.period;
            const clock = comp.status?.displayClock;
            const resultText = isFinal ? [method, round ? `R${round}` : '', (clock && clock !== '0:00') ? clock : ''].filter(Boolean).join(' • ') : '';
            const winnerSide = isFinal ? (away.winner ? 'away' : (home.winner ? 'home' : null)) : null;
            const leader = winnerSide ? (winnerSide === 'away' ? away : home) : away;

            const timeCenter = isLive ? `ROUND ${round || 1}${clock ? ' • ' + clock : ''}` : (isFinal ? (resultText || 'FINAL') : formatTimeCT(comp.date || ev.date));
            const tape = [];
            const ar = parseRecord(away.record), hr = parseRecord(home.record);
            pushMetric(tape, 'Career Wins', ar.w, hr.w);
            pushMetric(tape, 'Career Losses', ar.l, hr.l);
            const wpct = (r) => (r.w + r.l + (r.d || 0)) > 0 ? (r.w / (r.w + r.l + (r.d || 0))) * 100 : NaN;
            pushMetric(tape, 'Win %', wpct(ar), wpct(hr), pct0);
            if (isFinal && winnerSide) {
                tape.push({ label: 'Result', awayVal: winnerSide === 'away' ? 'WIN' : 'LOSS', homeVal: winnerSide === 'home' ? 'WIN' : 'LOSS',
                    awayPct: winnerSide === 'away' ? 100 : 0, homePct: winnerSide === 'home' ? 100 : 0 });
            }
            if (resultText) tape.push({ label: 'Method', awayVal: '', homeVal: resultText, noBar: true });

            const fighterCard = (f, side) => {
                const r = parseRecord(f.record);
                const outcome = winnerSide ? (winnerSide === side ? 'WIN' : 'LOSS') : '';
                return {
                    name: f.abbr, jersey: '', img: f.logo, fallbackImg: f.flag, watermark: f.flag,
                    pos: [weight || ep.label, outcome, outcome === 'WIN' ? method : '', outcome === 'WIN' && round ? `R${round}` : ''].filter(Boolean).join(' • '),
                    cols: [col(Number.isFinite(r.w) ? r.w : '', 'WIN', 'WINS'), col(Number.isFinite(r.l) ? r.l : '', 'LOSS', 'LOSSES'), col(Number.isFinite(r.d) ? r.d : '', 'DRAW', 'DRAWS')].filter(Boolean),
                    emptyText: 'RECORD UNAVAILABLE'
                };
            };

            const statusText = isLive ? `LIVE • R${round || 1}` : (isFinal ? 'FINAL' : 'UPCOMING');
            return {
                id: comp.id || ev.id, kind: 'fight', isFight: true, isLive, isFinal, isPregame, isFootball: false,
                league: `${ep.label} • ${dateLabel}`, leagueLabel: ep.label,
                winningColor1: leader.color, winningColor2: winnerSide ? '#ffea00' : home.color,
                status: statusText, statusClass: isLive ? 'status-live' : (isFinal ? 'status-final' : 'status-pregame'),
                network: comp.broadcasts?.[0]?.names?.[0] || ev.competitions?.[0]?.broadcasts?.[0]?.names?.[0] || '',
                odds: { spread: '', total: '', winProbText: '' }, field: null, linescores: null, winProb: null,
                away, home, timeCenter, vsText: weight || 'VS', winnerSide, resultText,
                subtitle: ev.shortName || ev.name || `${away.name} vs ${home.name}`,
                tapeMetrics: tape,
                players: { away: fighterCard(away, 'away'), home: fighterCard(home, 'home') },
                spotlightTitle: 'FIGHTER SPOTLIGHT', spotlightSub: isLive ? 'LIVE' : (isFinal ? 'RESULT' : 'FIGHT RECORDS'),
                tickerHtml: `<span class='league-tag'>${escapeHtml(ep.label)} (${dateLabel})</span> ${escapeHtml(away.name)} <span class="score-num">${escapeHtml(away.record)}</span> vs ${escapeHtml(home.name)} <span class="score-num">${escapeHtml(home.record)}</span> [${escapeHtml(isFinal ? (winnerSide ? `${(winnerSide === 'away' ? away : home).name} WINS ${resultText}` : 'FINAL') : timeCenter)}]`
            };
        }

        /* ================= REFRESH LOOP (one at a time, parallel requests) ================= */
        function scoreboardUrl(ep, date) {
            let u = `${ESPN}/${ep.sport}/${ep.league}/scoreboard?dates=${date}`;
            if (ep.groups) u += `&groups=${ep.groups}&limit=200`;
            return u;
        }
        const STATE_RANK = { in: 0, pre: 1, post: 2 };
        function eventState(ev) {
            return ev?.status?.type?.state || ev?.competitions?.[0]?.status?.type?.state || 'pre';
        }

        async function refreshAll() {
            if (refreshInFlight) return;
            refreshInFlight = true;
            try {
                const dates = [{ date: chicagoDateStr(0), label: 'TODAY' }, { date: chicagoDateStr(-1), label: 'YESTERDAY' }];
                const feeds = [];
                dates.forEach((d) => ENDPOINTS.forEach((ep) => feeds.push({ ep, ...d })));

                const [headlines, boards] = await Promise.all([
                    fetchNewsAndHeadlines(),
                    mapLimit(feeds, CONCURRENCY, (f) => fetchJSON(scoreboardUrl(f.ep, f.date)))
                ]);

                const seen = new Set();
                const jobs = [];
                feeds.forEach((f, i) => {
                    const events = boards[i]?.events;
                    if (!Array.isArray(events)) return;
                    const ordered = events
                        .map((ev, idx) => ({ ev, idx }))
                        .sort((a, b) => ((STATE_RANK[eventState(a.ev)] ?? 1) - (STATE_RANK[eventState(b.ev)] ?? 1)) || (a.idx - b.idx))
                        .slice(0, MAX_GAMES_PER_FEED);
                    ordered.forEach(({ ev }) => {
                        if (!ev || !ev.id || seen.has(ev.id)) return;
                        seen.add(ev.id);
                        jobs.push({ ev, ep: f.ep, dateLabel: f.label });
                    });
                });

                const collector = { redZones: [] };
                const results = await mapLimit(jobs, CONCURRENCY, (j) =>
                    j.ep.kind === 'fight' ? buildFightGame(j.ev, j.ep, j.dateLabel) : buildTeamGame(j.ev, j.ep, j.dateLabel, collector));
                const games = results.filter(Boolean);
                games.forEach(detectScoreChanges);

                const tickerItems = [...headlines, ...games.map((g) => g.tickerHtml)];
                if (games.length > 0) liveMatchups = games;
                if (tickerItems.length > 0) updateTicker(tickerItems);

                const badge = $('globalRedzoneBadge');
                if (collector.redZones.length) {
                    badge.textContent = collector.redZones.length === 1
                        ? collector.redZones[0]
                        : `🚨 ${collector.redZones.map((l) => l.replace(/^🚨\s*|\s*RED ZONE$/g, '') || '?').join(' • ')} RED ZONE`;
                    badge.classList.add('active');
                } else {
                    badge.classList.remove('active');
                }

                if (!hasRenderedOnce && liveMatchups.length) {
                    hasRenderedOnce = true;
                    currentMatchupIndex = 0;
                    rotatorElapsed = 0;
                    renderMatchup(0);
                } else if (!liveMatchups.length) {
                    $('gameStatus').textContent = 'NO GAMES TODAY';
                    $('gameStatus').className = 'game-status status-pregame';
                }
            } catch (err) {
                console.error('Refresh failed:', err);
            } finally {
                refreshInFlight = false;
                setTimeout(refreshAll, REFRESH_MS);
            }
        }

        /* ================= TICKER ================= */
        let tickerX = 0;
        let tickerAnimId = null;
        const tickerSpeed = 2.8;

        function updateTicker(items) {
            const one = items.map((it) => `<div class="ticker-item">${it}<span class="divider">///</span></div>`).join('');
            if (one === lastTickerHtml) return;   // avoid re-rendering (and logo flicker) when nothing changed
            lastTickerHtml = one;
            $('tickerContent').innerHTML = one + one + one;
            if (!tickerAnimId) startTickerLoop();
        }
        function startTickerLoop() {
            const container = $('tickerContent');
            function step() {
                tickerX -= tickerSpeed;
                const third = container.scrollWidth / 3;
                if (third > 0 && Math.abs(tickerX) >= third) tickerX += third;
                container.style.transform = `translate3d(${tickerX}px, 0, 0)`;
                tickerAnimId = requestAnimationFrame(step);
            }
            tickerAnimId = requestAnimationFrame(step);
        }

        /* ================= RENDER ================= */
        function setImg(el, src, fallback) {
            const primary = safeUrl(src), fb = safeUrl(fallback);
            el.onerror = () => {
                if (fb && el.dataset.src !== fb) { el.dataset.src = fb; el.src = fb; }
                else el.style.visibility = 'hidden';
            };
            const first = primary || fb;
            if (!first) { el.style.visibility = 'hidden'; el.removeAttribute('src'); el.dataset.src = ''; return; }
            el.style.visibility = 'visible';
            el.dataset.src = first;
            el.src = first;
        }

        // Safety net: shrink any stat value/label that still doesn't fit its column, by width AND height.
        // On tiny columns, long labels switch to standard broadcast abbreviations instead of becoming unreadable.
        const SHORT_LABELS = {
            POINTS: 'PTS', POINT: 'PT', REBOUNDS: 'REB', REBOUND: 'REB', ASSISTS: 'AST', ASSIST: 'AST',
            'PASS YDS': 'PASS', 'PASS YD': 'PASS', 'RUSH YDS': 'RUSH', 'RUSH YD': 'RUSH', 'REC YDS': 'REC', 'REC YD': 'REC',
            'COMP/ATT': 'C/ATT', CARRIES: 'CAR', CARRY: 'CAR', CATCHES: 'REC', CATCH: 'REC', YARDS: 'YDS', YARD: 'YD',
            'HOME RUNS': 'HR', 'HOME RUN': 'HR', HITS: 'H', HIT: 'H', GOALS: 'G', GOAL: 'G', SHOTS: 'S', SHOT: 'S',
            INTS: 'INT', RECORD: 'REC', WINS: 'W', WIN: 'W', LOSSES: 'L', LOSS: 'L', DRAWS: 'D', DRAW: 'D'
        };
        function shrinkFont(e, ratio) {
            const fs = parseFloat(getComputedStyle(e).fontSize);
            e.style.fontSize = `${Math.max(4, Math.floor(fs * ratio * 10) / 10)}px`;
        }
        function fitStatColumns() {
            document.querySelectorAll('.bp-stats').forEach((stats) => {
                const cols = Array.from(stats.querySelectorAll('.bp-col'));
                cols.forEach((c) => c.querySelectorAll('.bp-val, .bp-lbl').forEach((e) => {
                    e.style.fontSize = '';
                    if (e.dataset.full) e.textContent = e.dataset.full;
                }));
                // 1) width: keep a 4px gap on each side of the dividers
                cols.forEach((c) => {
                    const avail = c.clientWidth - 8;
                    if (avail <= 0) return;
                    const v = c.querySelector('.bp-val'), l = c.querySelector('.bp-lbl');
                    if (v && v.scrollWidth > avail) shrinkFont(v, avail / v.scrollWidth);
                    if (l && l.scrollWidth > avail) {
                        const fs = parseFloat(getComputedStyle(l).fontSize);
                        const short = SHORT_LABELS[l.textContent.trim()];
                        if (short && fs * (avail / l.scrollWidth) < 8) { l.dataset.full = l.textContent; l.textContent = short; }
                        if (l.scrollWidth > avail) shrinkFont(l, avail / l.scrollWidth);
                    }
                });
                // 2) height: number + label must fit the row under the position line
                const row = stats.querySelector('.bp-cols');
                const availH = row ? row.clientHeight - 2 : 0;
                stats.classList.toggle('no-labels', !!row && availH < 14);   // too short for number + label: keep the number only
                const need = cols.reduce((m, c) => {
                    const v = c.querySelector('.bp-val'), l = c.querySelector('.bp-lbl');
                    const lh = (l && l.offsetParent !== null) ? l.offsetHeight + parseFloat(getComputedStyle(l).marginTop || '0') : 0;
                    return Math.max(m, (v ? v.offsetHeight : 0) + lh);
                }, 0);
                if (availH > 0 && need > availH) {
                    const r = availH / need;
                    cols.forEach((c) => c.querySelectorAll('.bp-val, .bp-lbl').forEach((e) => shrinkFont(e, r)));
                }
            });
        }
        window.addEventListener('resize', () => requestAnimationFrame(fitStatColumns));

        function renderPlayerCard(side, p, teamColor) {
            const frame = $(`${side}HeadshotFrame`);
            frame.style.setProperty('--p-team-color', teamColor);
            frame.classList.toggle('is-logo', !!p.isTeam);
            setImg($(`${side}WatermarkLogo`), p.watermark || '', '');
            setImg($(`${side}PlayerImg`), p.img, p.fallbackImg);
            $(`${side}PlayerPos`).textContent = p.pos || '';
            $(`${side}PlayerName`).textContent = p.name || '';
            $(`${side}PlayerJersey`).textContent = p.jersey ? `(${p.jersey})` : '';
            const cols = (p.cols || []).filter((c) => c && hasVal(c.val));
            $(`${side}StatColsRow`).innerHTML = cols.length
                ? cols.map((c) => `<div class="bp-col"><div class="bp-val">${escapeHtml(c.val)}</div><div class="bp-lbl">${escapeHtml(c.lbl)}</div></div>`).join('')
                : `<div class="bp-empty">${escapeHtml(p.emptyText || 'STATS AT GAME TIME')}</div>`;
        }

        function renderMatchup(index) {
            if (!liveMatchups.length) return;
            const data = liveMatchups[index % liveMatchups.length];
            const cards = [$('matchupCard'), $('tapeCard'), $('spotlightCard')];
            cards.forEach((c) => c.classList.add('fade-out'));

            setTimeout(() => {
                const root = document.documentElement;
                root.style.setProperty('--team-primary', data.winningColor1);
                root.style.setProperty('--winning-color-1', data.winningColor1);
                root.style.setProperty('--winning-color-2', data.winningColor2);
                root.style.setProperty('--stadium-glow', `${data.winningColor1}35`);

                $('gameStatus').textContent = data.status;
                $('gameStatus').className = `game-status ${data.statusClass}`;
                $('networkInfo').textContent = data.network || '';
                $('leagueBadge').textContent = data.league || '';
                $('tapeMatchupSub').textContent = data.subtitle || '';

                const momentum = $('momentumBadge');
                if (data.isLive && data.field?.isRedZone) {
                    momentum.textContent = data.field.redZoneLabel;
                    momentum.classList.add('active');
                } else {
                    momentum.classList.remove('active');
                }

                // Tale of the tape
                const grid = $('tapeMetricsGrid');
                $('tapeHeaderTitle').textContent = data.isFight ? '⚡ Tale of the Tape' : '⚡ Tale of the Tape & Comparison';
                grid.innerHTML = data.tapeMetrics.length ? data.tapeMetrics.map((m) => `
                    <div class="tape-metric-row">
                        <span class="tape-metric-label">${escapeHtml(m.label)}</span>
                        <span class="tape-metric-val-away" style="color: ${data.away.color};">${escapeHtml(m.awayVal)}</span>
                        <div class="tape-bar-container${m.noBar ? ' no-bar' : ''}">
                            ${m.noBar ? '' : `<div class="tape-bar-fill-away" style="width: ${m.awayPct}%; background-color: ${data.away.color};"></div>
                            <div class="tape-bar-fill-home" style="width: ${m.homePct}%; background-color: ${data.home.color};"></div>`}
                        </div>
                        <span class="tape-metric-val-home" style="color: ${data.home.color};">${escapeHtml(m.homeVal)}</span>
                    </div>`).join('')
                    : `<div class="tape-empty">Comparison stats appear once ESPN posts them</div>`;

                // Teams / fighters
                ['away', 'home'].forEach((side) => {
                    const t = data[side];
                    setImg($(`${side}Logo`), t.logo, t.fallbackLogo);
                    $(`${side}Name`).textContent = t.name;
                    $(`${side}Record`).textContent = t.record;
                    let scoreText = String(t.score);
                    if (data.isFight) scoreText = data.winnerSide ? (data.winnerSide === side ? 'W' : 'L') : '';
                    $(`${side}Score`).textContent = scoreText;
                });
                $('vsText').textContent = data.vsText || 'VS';
                $('gameTimeCenter').textContent = data.timeCenter;

                // Line score (abbreviations keep the table narrow)
                const lineContainer = $('lineScoreContainer');
                if (data.linescores && data.linescores.periods.length) {
                    lineContainer.style.display = 'block';
                    $('lineScoreHeaderRow').innerHTML = `<th>Team</th>` + data.linescores.periods.map((p) => `<th>${escapeHtml(p)}</th>`).join('') + `<th>T</th>`;
                    $('lineScoreBody').innerHTML = ['away', 'home'].map((side) => `
                        <tr><td>${escapeHtml(data[side].abbr)}</td>${data.linescores[side + 'Lines'].map((v) => `<td>${escapeHtml(v)}</td>`).join('')}<td><strong>${data[side].score}</strong></td></tr>`).join('');
                } else {
                    lineContainer.style.display = 'none';
                }

                // Football field
                const fieldBox = $('footballFieldContainer');
                if (data.isLive && data.isFootball && data.field) {
                    fieldBox.style.display = 'flex';
                    const f = data.field;
                    setImg($('footballLeftLogoImg'), f.left.logo, '');
                    setImg($('footballRightLogoImg'), f.right.logo, '');
                    $('footballLeftEz').style.backgroundColor = `${f.left.color}55`;
                    $('footballRightEz').style.backgroundColor = `${f.right.color}55`;
                    $('footballSituationText').textContent = f.text;
                    const ball = $('footballBallMarker'), fd = $('footballFirstDownLine');
                    ball.style.display = f.ballPct === null ? 'none' : 'block';
                    fd.style.display = f.firstDownPct === null ? 'none' : 'block';
                    if (f.ballPct !== null) ball.style.left = `${f.ballPct}%`;
                    if (f.firstDownPct !== null) fd.style.left = `${f.firstDownPct}%`;
                } else {
                    fieldBox.style.display = 'none';
                }

                // Odds (hidden entirely when ESPN has none)
                const o = data.odds;
                $('oddsBar').style.display = (o.spread || o.total || o.winProbText) ? 'flex' : 'none';
                $('oddsSpreadItem').style.display = o.spread ? '' : 'none';
                $('oddsTotalItem').style.display = o.total ? '' : 'none';
                $('oddsWpItem').style.display = o.winProbText ? '' : 'none';
                $('oddsSpread').textContent = o.spread;
                $('oddsTotal').textContent = o.total;
                $('oddsML').textContent = o.winProbText;

                // Spotlight
                $('spotlightHeaderText').textContent = data.spotlightTitle;
                $('spotlightSubText').textContent = data.spotlightSub;
                renderPlayerCard('away', data.players.away, data.away.rawColor);
                renderPlayerCard('home', data.players.home, data.home.rawColor);
                fitStatColumns();

                cards.forEach((c) => c.classList.remove('fade-out'));
            }, 400);
        }

        function startRotator() {
            const progressBar = $('rotatorProgress');
            const step = 50;
            setInterval(() => {
                if (!liveMatchups.length) return;
                rotatorElapsed += step;
                progressBar.style.width = `${Math.min(100, (rotatorElapsed / ROTATE_INTERVAL_MS) * 100)}%`;
                if (rotatorElapsed >= ROTATE_INTERVAL_MS) {
                    rotatorElapsed = 0;
                    currentMatchupIndex = (currentMatchupIndex + 1) % liveMatchups.length;
                    renderMatchup(currentMatchupIndex);
                }
            }, step);
        }

        function updateClock() {
            $('liveClock').textContent = new Date().toLocaleTimeString('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit', hour12: true });
        }

        $('rotateBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            $('bodyEl').classList.toggle('rotated-90');
            requestAnimationFrame(() => { resizeCanvas(); fitStatColumns(); });
        });

        // Inspection hook (used for verification): jump to a game without waiting for rotation.
        window.__monkeyBar = {
            games: () => liveMatchups.map((g, i) => ({ i, league: g.league, kind: g.kind, status: g.status, isLive: g.isLive, isFinal: g.isFinal })),
            show: (i) => { currentMatchupIndex = i; rotatorElapsed = 0; renderMatchup(i); },
            alerts: () => alertHistory.slice()
        };

        updateClock();
        setInterval(updateClock, 1000);
        startRotator();
        refreshAll();
    })();
    </script>
</body>
</html>
